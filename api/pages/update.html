<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Student</title>

    <link rel="stylesheet" href="/styles/style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">S</div>

            <div>
                <h2>Student</h2>
                <span>Management</span>
            </div>
        </div>

        <nav>
            <a href="/">Dashboard</a>
            <a href="/add">Add Student</a>
            <a href="/students">View All Students</a>
            <a href="/search">Search Student</a>
            <a href="/update" class="active">Update Student</a>
            <a href="/delete">Delete Student</a>
        </nav>

    </aside>

    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Update Student</h1>
                <p>Update existing student information</p>
            </div>

            <div class="profile">
                <div class="profile-circle">M</div>
                <span>Admin</span>
            </div>

        </header>

        <section class="content-card">

            <form action="/update" method="POST">

                <label>Student ID</label>

                <input
                    type="number"
                    name="id"
                    placeholder="Enter Student ID"
                    required
                >

                <label>Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter Name"
                    required
                >

                <label>Age</label>

                <input
                    type="number"
                    name="age"
                    placeholder="Enter Age"
                    required
                >

                <label>Course</label>

                <input
                    type="text"
                    name="course"
                    placeholder="Enter Course"
                    required
                >

                <label>Marks</label>

                <input
                    type="number"
                    name="marks"
                    min="0"
                    max="100"
                    step="0.01"
                    placeholder="Enter Marks"
                    required
                >

                <button type="submit" class="view-btn">
                    Update Student
                </button>

            </form>

        </section>

    </main>

</div>

</body>
</html>
